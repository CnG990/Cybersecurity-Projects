# /etc/systemd/resolved.conf.d/99-family-dns.conf
# Cloudflare for Families (blocks malware + adult content) over DNS-over-TLS.
# Apply with: sudo cp this file into place && sudo systemctl restart systemd-resolved
# The "#hostname" suffix is what makes resolved validate the TLS certificate.
[Resolve]
DNS=1.1.1.3#family.cloudflare-dns.com 1.0.0.3#family.cloudflare-dns.com 2606:4700:4700::1113#family.cloudflare-dns.com 2606:4700:4700::1003#family.cloudflare-dns.com
FallbackDNS=
Domains=~.
DNSOverTLS=yes
DNSSEC=allow-downgrade
Cache=yes
DNSStubListener=yes
