# /etc/unbound/unbound.conf.d/family-dns.conf
# Unbound as a caching forwarder to the family filter, over DNS-over-TLS.
server:
    interface: 127.0.0.1
    interface: 192.168.1.1          # adjust to the LAN address of this host
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow
    do-not-query-localhost: no
    prefetch: yes
    cache-min-ttl: 60
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    # Optional local additions, applied before the upstream filter is asked.
    # local-zone: "example-adult-site.com" always_nxdomain

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.3@853#family.cloudflare-dns.com
    forward-addr: 1.0.0.3@853#family.cloudflare-dns.com
    forward-addr: 2606:4700:4700::1113@853#family.cloudflare-dns.com
    forward-addr: 2606:4700:4700::1003@853#family.cloudflare-dns.com
