# /etc/dnsmasq.d/family-dns.conf
# dnsmasq as the LAN resolver: forward everything to the family filter and
# ignore whatever DNS servers the ISP hands out over DHCP.
no-resolv
strict-order
server=1.1.1.3
server=1.0.0.3
server=2606:4700:4700::1113
server=2606:4700:4700::1003

# Second layer: block extra domains locally, including every subdomain.
# address=/example-adult-site.com/0.0.0.0

# Never hand out the ISP resolver to clients - advertise this box instead.
dhcp-option=option:dns-server,0.0.0.0

# Cache and logging (useful to confirm a device is being filtered).
cache-size=10000
log-queries=extra
log-facility=/var/log/dnsmasq.log
